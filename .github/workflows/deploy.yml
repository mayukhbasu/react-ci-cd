name: Deploy React App to GCS with Workload Identity Federation

on:
  push:
    branches: [ci-cd]  # Trigger on ci-cd branch
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      GCS_BUCKET: custody-backend-java-frontend
      GCP_PROJECT_ID: custody-backend-java

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build the React app
        run: npm run build

      - name: Authenticate with Workload Identity Federation
        uses: google-github-actions/auth@v1
        with:
          token_format: access_token
          create_credentials_file: true
          workload_identity_provider: 'projects/294043054811/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'custody-sa@custody-backend-java.iam.gserviceaccount.com'

      - name: Upload build folder to GCS
        uses: google-github-actions/upload-cloud-storage@v1
        with:
          path: build
          destination: ${{ env.GCS_BUCKET }}
          parent: false

      - name: Make all files public using IAM (skip ACLs)
        run: |
          gsutil iam ch allUsers:objectViewer gs://${{ env.GCS_BUCKET }}

      - name: Set bucket website config
        run: gsutil web set -m index.html -e 404.html gs://${{ env.GCS_BUCKET }}

      - name: Confirm deployment URL
        run: echo "https://storage.googleapis.com/${{ env.GCS_BUCKET }}/index.html"
